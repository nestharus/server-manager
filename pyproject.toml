[project]
name = "discord-server-manager"
version = "0.1.0"
description = "Local CLI + agent-friendly wrappers around the Discord REST API for managing one guild."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3",
    "python-dotenv",
    "aiohttp",
    "httpx",
    "pytest-asyncio",
    "PyYAML",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-json-report>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["discord_cli.py", "daemon"]

[tool.pytest.ini_options]
pythonpath = ["."]
