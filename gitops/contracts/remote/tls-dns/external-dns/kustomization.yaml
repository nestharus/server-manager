apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - channel-parameters.yaml
  - rendered/external-dns-1.20.0.yaml
replacements:
  - source:
      kind: ConfigMap
      name: external-dns-channel
      fieldPath: data.channelId
    targets:
      - select:
          kind: Deployment
          name: external-dns
        fieldPaths:
          - spec.template.spec.containers.[name=external-dns].args.7
        options:
          delimiter: "humility-"
          index: 1
