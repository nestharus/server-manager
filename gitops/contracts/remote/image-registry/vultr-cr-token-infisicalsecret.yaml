apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: vultr-cr-credentials
  namespace: app-runtime
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-registry
        envSlug: dev
        secretsPath: /registry/dev
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: vultr-cr-credentials
    secretNamespace: app-runtime
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: Owner
    template:
      includeAllSecrets: true
