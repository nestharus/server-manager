apiVersion: v1
kind: ConfigMap
metadata:
  name: channel-image-registry
  namespace: app-runtime
  labels:
    app.kubernetes.io/name: channel-image-registry
    platform.humility.gg/init: "108"
data:
  provider: vultr-container-registry
  registryUrl: ewr.vultrcr.com/humility
  pushUrl: ewr.vultrcr.com/humility
  pullUrl: ewr.vultrcr.com/humility
  repositoryPrefix: dev
  imageNamePattern: ewr.vultrcr.com/humility/dev/${app}:${tag}
  credentialSecretName: vultr-cr-credentials
  credentialSecretNamespace: app-runtime
  credentialSecretKey: .dockerconfigjson
