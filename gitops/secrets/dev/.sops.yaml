# Per-channel SOPS creation rules for the `dev` channel.
# Owner: INIT-009 SLICE-034.
#
# Encryption:
#   - Per Q4 (2026-04-25), per-channel age recipients.
#   - This file lists public recipients. Private keys are operator-local.
#
# Custody:
#   - Operator generates the dev channel's age key with:
#     `age-keygen -o ~/.config/sops/age/dev.txt`
#   - Operator captures the public key with:
#     `age-keygen -y ~/.config/sops/age/dev.txt`
#   - Operator commits the public key here.
#   - SOPS reads the private key from `SOPS_AGE_KEY_FILE` or
#     `~/.config/sops/age/dev.txt`.
#
# PLACEHOLDER: age-keygen/sops were not installed when SLICE-034 was
# implemented in this worktree. Replace this recipient before use.

creation_rules:
  - path_regex: gitops/secrets/dev/.*\.enc\.yaml
    encrypted_regex: ^(data|stringData)$
    age:
      - age1<REPLACE_WITH_REAL_RECIPIENT_BEFORE_USE>  # PLACEHOLDER; run `age-keygen` and replace before use
