apiVersion: v1
kind: Namespace
metadata:
  name: git-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-daemon-pvc
  namespace: git-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-daemon
  namespace: git-system
  labels:
    app.kubernetes.io/name: git-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-daemon
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-git-http-tools
          image: alpine/git:v2.45.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp -R "$(git --exec-path)/." /git-core/
              apk add --no-cache git-daemon=2.45.4-r0 busybox-extras=1.36.1-r31 >/dev/null
              cp -R /usr/libexec/git-core/. /git-core/
              cp /bin/busybox-extras /tools/httpd
              chmod -R 0555 /git-core /tools
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: git-core-tools
              mountPath: /git-core
            - name: git-http-tools
              mountPath: /tools
      containers:
        - name: git-daemon
          image: alpine/git:v2.45.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - exec sleep infinity
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: git-data
              mountPath: /srv/git
            - name: git-daemon-tmp
              mountPath: /tmp
            - name: git-core-tools
              mountPath: /usr/libexec/git-core
              readOnly: true
        - name: git-http
          image: alpine/git:v2.45.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /tmp/www/cgi-bin
              cat > /tmp/www/cgi-bin/git <<'EOF'
              #!/bin/sh
              export GIT_PROJECT_ROOT=/srv/git
              export GIT_HTTP_EXPORT_ALL=1
              exec git http-backend
              EOF
              chmod +x /tmp/www/cgi-bin/git
              exec /opt/git-http-tools/httpd -f -p 8080 -h /tmp/www
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: git-data
              mountPath: /srv/git
              readOnly: true
            - name: git-core-tools
              mountPath: /usr/libexec/git-core
              readOnly: true
            - name: git-http-tools
              mountPath: /opt/git-http-tools
              readOnly: true
            - name: git-http-tmp
              mountPath: /tmp
      volumes:
        - name: git-data
          persistentVolumeClaim:
            claimName: git-daemon-pvc
        - name: git-core-tools
          emptyDir: {}
        - name: git-http-tools
          emptyDir: {}
        - name: git-daemon-tmp
          emptyDir: {}
        - name: git-http-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-local
  namespace: git-system
  labels:
    app.kubernetes.io/name: git-daemon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: git-daemon
  ports:
    - name: http
      port: 8080
      targetPort: http
