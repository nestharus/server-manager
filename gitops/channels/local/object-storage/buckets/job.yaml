apiVersion: batch/v1
kind: Job
metadata:
  name: create-sample-bucket
  namespace: minio-system
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-sample-bucket
        app.kubernetes.io/component: object-storage-bootstrap
    spec:
      serviceAccountName: create-sample-bucket
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mc alias set local http://minio.minio-system.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc ready local
              mc mb --ignore-existing local/humility-local-sample
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
