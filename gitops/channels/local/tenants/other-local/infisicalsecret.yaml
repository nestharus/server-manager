apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: tenant-runtime
  namespace: other-local
  labels:
    platform.humility.gg/tenant: other
    platform.humility.gg/channel: local
    platform.humility.gg/tenant-channel: other-local
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: tenant-other-local
        envSlug: local
        secretsPath: /runtime
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: tenant-runtime
    secretNamespace: other-local
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: true
