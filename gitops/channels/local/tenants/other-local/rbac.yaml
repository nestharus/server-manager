apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-operator
  namespace: other-local
  labels:
    platform.humility.gg/tenant: other
    platform.humility.gg/channel: local
    platform.humility.gg/tenant-channel: other-local
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources:
      - configmaps
      - deployments
      - jobs
      - networkpolicies
      - pods
      - pods/log
      - secrets
      - services
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-operators
  namespace: other-local
  labels:
    platform.humility.gg/tenant: other
    platform.humility.gg/channel: local
    platform.humility.gg/tenant-channel: other-local
subjects:
  - kind: Group
    name: humility:tenant:other:operators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-operator
