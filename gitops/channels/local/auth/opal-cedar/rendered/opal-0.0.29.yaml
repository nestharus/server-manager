# Source: opal/templates/deployment-client.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "opal-client"
  labels:
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.7.12"
    helm.sh/chart: "opal-0.0.29"
    app.kubernetes.io/name: "opal-client"
    app.kubernetes.io/instance: "opal"
    opal.ac/role: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "opal-client"
      app.kubernetes.io/instance: "opal"
      opal.ac/role: client
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.7.12"
        helm.sh/chart: "opal-0.0.29"
        app.kubernetes.io/name: "opal-client"
        app.kubernetes.io/instance: "opal"
        opal.ac/role: client
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opal-client
          image: "docker.io/permitio/opal-client-cedar:0.7.12"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 7000
              protocol: TCP
            - name: opa
              containerPort: 8180
              protocol: TCP
          env:
            - name: UVICORN_NUM_WORKERS
              value: "1"
            - name: OPAL_SERVER_URL
              value: "http://opal-server:7002"
            - name: OPAL_DATA_UPDATER_ENABLED
              value: "False"
            - name: OPAL_POLICY_STORE_AUTH_TYPE
              value: "none"
            - name: OPAL_POLICY_STORE_TYPE
              value: "cedar"
            - name: OPAL_POLICY_STORE_URL
              value: "http://localhost:8180"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            failureThreshold: 5
            initialDelaySeconds: 5
            timeoutSeconds: 10
            periodSeconds: 15

          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            failureThreshold: 5
            timeoutSeconds: 10
            periodSeconds: 30
