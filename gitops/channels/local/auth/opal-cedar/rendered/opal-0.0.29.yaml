# Source: opal/templates/tests/e2e.yaml
apiVersion: v1
kind: Pod
metadata:
  name: opal-e2e
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
  - name: e2e
    image: "apteno/alpine-jq:2021-04-25"
    command:
    - '/bin/sh'
    - '-c'
    - |
      set -x
      set -e

      sleep 15

      [ "$(curl -s http://opal-client:8180/v1/data | jq '.result.users | keys | length')" -eq 3 ]
      [ "$(curl -s http://opal-client:8180/v1/data | jq '.result.role_permissions | keys | length')" -eq 3 ]
