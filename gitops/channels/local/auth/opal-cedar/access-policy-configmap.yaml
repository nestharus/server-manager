apiVersion: v1
kind: ConfigMap
metadata:
  name: cedar-access-policy-bundle
  namespace: auth-system
  labels:
    app.kubernetes.io/name: opal-cedar
    app.kubernetes.io/component: policy-bundle
    platform.humility.gg/init: "115"
data:
  policies.json: |
    [
      {
        "id": "local-server-manager-api-user-read",
        "content": "permit(principal == User::\"sample@local.humility.local\", action == Action::\"api:read\", resource == Resource::\"server-manager-api\");"
      },
      {
        "id": "local-server-manager-api-buildkite-deploy",
        "content": "permit(principal == Service::\"buildkite-agent.local\", action == Action::\"api:ci:deploy\", resource == Resource::\"server-manager-api\");"
      },
      {
        "id": "public-intake-allow",
        "content": "permit(principal == Public::\"web-intake.local\", action == Action::\"application:submit_public\", resource == Resource::\"server-manager-api:public-applications\");"
      },
      {
        "id": "public-intake-no-read",
        "content": "forbid(principal == Public::\"web-intake.local\", action == Action::\"api:read\", resource == Resource::\"server-manager-api\");"
      },
      {
        "id": "local-cluster-api-crossplane-reconcile",
        "content": "permit(principal == Service::\"crossplane-provider.local\", action == Action::\"cluster:claim:reconcile\", resource == Resource::\"cluster-api\");"
      },
      {
        "id": "local-tenant-sample-local-access",
        "content": "permit(principal == Tenant::\"sample\", action == Action::\"tenant:channel:access\", resource == TenantChannel::\"sample:local\");"
      },
      {
        "id": "local-tenant-sample-dev-access",
        "content": "permit(principal == Tenant::\"sample\", action == Action::\"tenant:channel:access\", resource == TenantChannel::\"sample:dev\");"
      },
      {
        "id": "local-tenant-other-local-access",
        "content": "permit(principal == Tenant::\"other\", action == Action::\"tenant:channel:access\", resource == TenantChannel::\"other:local\");"
      }
    ]
