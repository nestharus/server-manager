apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-init-114-blueprint
  namespace: auth-system
  labels:
    app.kubernetes.io/name: authentik
    platform.humility.gg/init: "114"
data:
  init-114-local-users.yaml: |
    version: 1
    metadata:
      name: init-114-local-users
      labels:
        blueprints.goauthentik.io/instantiate: "true"
        blueprints.goauthentik.io/description: "INIT-114 local sample user"
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: Humility Local Users
        attrs:
          name: Humility Local Users
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: officers
        attrs:
          name: officers
          is_superuser: false
      - model: authentik_core.user
        state: present
        identifiers:
          username: sample
        attrs:
          username: sample
          name: Humility Sample User
          email: !Env [SAMPLE_USER_EMAIL, sample@local.humility.local]
          password: !Env [SAMPLE_USER_PASSWORD, ""]
          is_active: true
          groups:
            - !Find [authentik_core.group, [name, Humility Local Users]]
            - !Find [authentik_core.group, [name, officers]]
          attributes:
            discord_user_id: "210987654321098765"
  init-127-applicant-discord-oauth.yaml: |
    version: 1
    metadata:
      name: init-127-applicant-discord-oauth
      labels:
        blueprints.goauthentik.io/instantiate: "true"
        blueprints.goauthentik.io/description: "INIT-127 applicant Discord OAuth"
    entries:
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        state: present
        identifiers:
          name: discord-applicant-snowflake
        attrs:
          name: discord-applicant-snowflake
          expression: |
            return {
                "attributes": {
                    "discord_user_id": info.get("id"),
                }
            }
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: server-manager-applicant-discord_user_id
        attrs:
          name: server-manager-applicant-discord_user_id
          scope_name: discord_user_id
          description: Discord snowflake for applicant identity receipt
          expression: |
            return {
                "discord_user_id": request.user.attributes.get('discord_user_id'),
            }
      - model: authentik_sources_oauth.oauthsource
        state: present
        identifiers:
          slug: discord-applicant
        attrs:
          name: Discord Applicant
          slug: discord-applicant
          provider_type: discord
          consumer_key: !Env [DISCORD_APPLICANT_OAUTH_CLIENT_ID, ""]
          consumer_secret: !Env [DISCORD_APPLICANT_OAUTH_CLIENT_SECRET, ""]
          access_token_url: ""
          authorization_url: ""
          profile_url: ""
          oidc_jwks_url: ""
          oidc_well_known_url: ""
          request_token_url: ""
          scope: identify
          property_mappings:
            - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, discord-applicant-snowflake]]
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: server-manager-applicant
        attrs:
          name: server-manager-applicant
          client_id: !Env [APPLICANT_OIDC_CLIENT_ID, humility-local-server-manager-applicant]
          client_secret: !Env [APPLICANT_OIDC_CLIENT_SECRET, ""]
          client_type: confidential
          issuer_mode: per_provider
          include_claims_in_id_token: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://web.local.humility.local/auth/discord/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, server-manager-applicant-discord_user_id]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: server-manager-applicant
        attrs:
          name: Server Manager Applicant
          slug: server-manager-applicant
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, server-manager-applicant]]
          launch_url: https://web.local.humility.local/applications
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, discord-applicant]]
  init-133B-pomerium-officer-discord.yaml: |
    version: 1
    metadata:
      name: init-133B-pomerium-officer-discord
      labels:
        blueprints.goauthentik.io/instantiate: "true"
        blueprints.goauthentik.io/description: "INIT-133B Pomerium officer Discord OAuth"
    entries:
      - model: authentik_sources_oauth.oauthsourcepropertymapping
        state: present
        identifiers:
          name: discord-pomerium-snowflake
        attrs:
          name: discord-pomerium-snowflake
          expression: |
            return {
                "attributes": {
                    "discord_user_id": info.get("id"),
                }
            }
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: server-manager-pomerium-discord_user_id
        attrs:
          name: server-manager-pomerium-discord_user_id
          scope_name: discord_user_id
          description: Discord snowflake for officer Pomerium identity
          expression: |
            return {
                "discord_user_id": request.user.attributes.get('discord_user_id'),
            }
      - model: authentik_sources_oauth.oauthsource
        state: present
        identifiers:
          slug: discord-pomerium
        attrs:
          name: Discord Pomerium Officer
          slug: discord-pomerium
          provider_type: discord
          consumer_key: !Env [DISCORD_OFFICER_OAUTH_CLIENT_ID, ""]
          consumer_secret: !Env [DISCORD_OFFICER_OAUTH_CLIENT_SECRET, ""]
          access_token_url: ""
          authorization_url: ""
          profile_url: ""
          oidc_jwks_url: ""
          oidc_well_known_url: ""
          request_token_url: ""
          scope: identify
          property_mappings:
            - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, discord-pomerium-snowflake]]
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: pomerium
        attrs:
          name: pomerium
          client_id: !Env [OIDC_CLIENT_ID, humility-local-pomerium]
          client_secret: !Env [OIDC_CLIENT_SECRET, ""]
          client_type: confidential
          issuer_mode: per_provider
          include_claims_in_id_token: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          redirect_uris:
            - matching_mode: strict
              url: https://authenticate.local.humility.local/oauth2/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, server-manager-pomerium-discord_user_id]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: pomerium
        attrs:
          name: Pomerium
          slug: pomerium
          meta_description: server-manager-pomerium-discord_user_id
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, pomerium]]
          launch_url: https://web.local.humility.local/
          sources:
            - !Find [authentik_sources_oauth.oauthsource, [slug, discord-pomerium]]
