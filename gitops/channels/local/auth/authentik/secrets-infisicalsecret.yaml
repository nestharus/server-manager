apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-secrets
  namespace: auth-system
  labels:
    app.kubernetes.io/name: authentik
    platform.humility.gg/init: "114"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-auth
        envSlug: local
        secretsPath: /auth/local/authentik
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: authentik-config
    secretNamespace: auth-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY.Value }}"
        AUTHENTIK_POSTGRESQL__HOST: "authentik-postgres-rw.auth-system.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .POSTGRES_PASSWORD.Value }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .AUTHENTIK_BOOTSTRAP_EMAIL.Value }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD.Value }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN.Value }}"
        SAMPLE_USER_EMAIL: "{{ .SAMPLE_USER_EMAIL.Value }}"
        SAMPLE_USER_PASSWORD: "{{ .SAMPLE_USER_PASSWORD.Value }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID.Value }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-postgres-app
  namespace: auth-system
  labels:
    app.kubernetes.io/name: authentik-postgres
    platform.humility.gg/init: "114"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-auth
        envSlug: local
        secretsPath: /auth/local/authentik
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: authentik-postgres-app
    secretNamespace: auth-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        username: "authentik"
        password: "{{ .POSTGRES_PASSWORD.Value }}"
