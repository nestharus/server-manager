apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-system
resources:
  - secrets-infisicalsecret.yaml
  - rendered/pomerium-34.0.1.yaml
  - ingress.yaml
  - local-dns-alias.yaml
patches:
  - path: local-all-in-one-patch.yaml
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/instance=pomerium
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      kind: Service
      labelSelector: app.kubernetes.io/instance=pomerium
    patch: |-
      - op: add
        path: /spec/publishNotReadyAddresses
        value: true
