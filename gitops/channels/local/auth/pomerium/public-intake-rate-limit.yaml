apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-public-intake
  namespace: auth-system
  labels:
    app.kubernetes.io/name: pomerium
    platform.humility.gg/init: "120"
  annotations:
    cert-manager.io/issuer: humility-local-step-ca
    cert-manager.io/issuer-kind: StepClusterIssuer
    cert-manager.io/issuer-group: certmanager.step.sm
    konghq.com/plugins: public-intake-rate-limit
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - web.local.humility.local
      secretName: web-local-ingress-tls
  rules:
    - host: web.local.humility.local
      http:
        paths:
          - path: /api/public/applications
            pathType: Prefix
            backend:
              service:
                name: pomerium-proxy
                port:
                  number: 80
          - path: /api/applications
            pathType: Prefix
            backend:
              service:
                name: pomerium-proxy
                port:
                  number: 80
