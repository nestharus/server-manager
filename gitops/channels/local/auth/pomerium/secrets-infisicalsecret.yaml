apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pomerium-config
  namespace: auth-system
  labels:
    app.kubernetes.io/name: pomerium
    platform.humility.gg/init: "114"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-auth
        envSlug: local
        secretsPath: /auth/local/pomerium
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: pomerium-config
    secretNamespace: auth-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        config.yaml: |
          authenticate_service_url: https://authenticate.local.humility.local
          idp_provider: oidc
          idp_provider_url: https://auth.local.humility.local/application/o/pomerium/
          idp_client_id: "{{ .OIDC_CLIENT_ID.Value }}"
          idp_client_secret: "{{ .OIDC_CLIENT_SECRET.Value }}"
          idp_scopes: openid email profile
          # LOCAL ONLY: local Pomerium terminates behind the local Kong/Step CA path.
          insecure_server: true
          # LOCAL ONLY: local all-in-one mode uses insecure internal gRPC.
          grpc_insecure: true
          routes:
            - from: https://protected-api.local.humility.local
              to: http://server-manager-api.server-manager.svc.cluster.local:8000
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
---
apiVersion: secrets.infisical.com/v1alpha1
