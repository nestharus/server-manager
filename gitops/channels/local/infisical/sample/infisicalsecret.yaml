apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-local-sample
  namespace: infisical-sample
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectId: platform-local
        envSlug: local
        secretsPath: /sample
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: infisical-local-sample
    secretNamespace: infisical-sample
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: true
