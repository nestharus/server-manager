  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/instance: infisical-operator
    app.kubernetes.io/version: v0.10.32
  namespace: infisical-system
spec:
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/instance: infisical-operator
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-opera-controller-manager
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/instance: infisical-operator
    app.kubernetes.io/version: v0.10.32
  namespace: infisical-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: secrets-operator
      app.kubernetes.io/instance: infisical-operator
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: secrets-operator
        app.kubernetes.io/instance: infisical-operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: cluster.local
        - name: INFISICAL_HOST_API
          value: http://infisical.infisical-system.svc.cluster.local:8080
        - name: INFISICAL_LOG_WRITER
          value: stderr
        image: infisical/kubernetes-operator:v0.10.32
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: infisical-opera-controller-manager
      terminationGracePeriodSeconds: 10
      nodeSelector: {}
      tolerations: []
