apiVersion: v1
kind: Service
metadata:
  name: infisical
  namespace: infisical-system
  labels:
    component: infisical
    app: infisical-standalone
    release: infisical
spec:
  type: ClusterIP
  selector:
    component: infisical
    app: infisical-standalone
    release: infisical
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
