infisical:
  replicaCount: 1
  image:
    repository: infisical/infisical
    tag: v0.151.0
    pullPolicy: IfNotPresent
  kubeSecretRef: infisical-server-bootstrap
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 350m
    limits:
      memory: 1000Mi
  autoBootstrap:
    enabled: false
ingress:
  enabled: false
  nginx:
    enabled: false
postgresql:
  enabled: true
  fullnameOverride: postgresql
  image:
    registry: mirror.gcr.io
    repository: bitnamilegacy/postgresql
    tag: 16.2.0-debian-11-r16
  auth:
    username: infisical
    database: infisicalDB
    existingSecret: infisical-server-bootstrap
    secretKeys:
      adminPasswordKey: POSTGRES_POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: infisical-server-bootstrap
      key: DB_CONNECTION_URI
  primary:
    # INIT-107 owns the cluster NetworkPolicy baseline. The chart defaults
    # are intentionally disabled here because they allow broad ingress.
    networkPolicy:
      enabled: false
    persistence:
      size: 8Gi
redis:
  enabled: true
  fullnameOverride: redis
  image:
    registry: mirror.gcr.io
    repository: bitnamilegacy/redis
    tag: 7.2.4-debian-11-r18
  auth:
    existingSecret: infisical-server-bootstrap
    existingSecretPasswordKey: REDIS_PASSWORD
  # INIT-107 owns the cluster NetworkPolicy baseline. The chart default
  # includes allow-all egress, so keep it disabled until that baseline lands.
  networkPolicy:
    enabled: false
  master:
    persistence:
      size: 8Gi
