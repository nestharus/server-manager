---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: step-ca-config
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: step-ca
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
---
apiVersion: v1
kind: Secret
metadata:
  name: step-ca-ca-password
  namespace: step-ca-system
---
apiVersion: v1
kind: Secret
metadata:
  name: step-ca-provisioner-password
  namespace: step-ca-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-config
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-certs
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-secrets
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-bootstrap
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
data:
  bootstrap.sh: "#!/bin/sh\nSTEPPATH=/home/step\necho -e \"\\e[1mWelcome to Step Certificates\
    \ configuration.\\e[0m\\n\"\n\nfunction permission_error () {\n  echo -e \"\\\
    033[0;31mPERMISSION ERROR:\\033[0m $1\\n\"\n  exit 1\n}\n\nfunction kbreplace()\
    \ {\n  kubectl $@ -o yaml --dry-run=client | kubectl replace -f -\n}\n\necho -e\
    \ \"\\e[1mConfiguring kubctl with service account...\\e[0m\"\n# Use the service\
    \ account context\nkubectl config set-cluster cfc --server=https://kubernetes.default\
    \ --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    kubectl config set-credentials bootstrap --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\n\
    kubectl config set-context cfc --cluster=cfc --user=bootstrap\nkubectl config\
    \ use-context cfc\n\necho -e \"\\n\\e[1mChecking cluster permissions...\\e[0m\"\
    \necho -n \"Checking for permission to create configmaps in step-ca-system namespace:\
    \ \"\nkubectl auth can-i create configmaps --namespace step-ca-system\nif [ $?\
    \ -ne 0 ]; then\n  permission_error \"create configmaps\"\nfi\n\necho -n \"Checking\
    \ for permission to create secrets in step-ca-system namespace: \"\nkubectl auth\
    \ can-i create secrets --namespace step-ca-system\nif [ $? -ne 0 ]; then\n  permission_error\
    \ \"create secrets\"\nfi\n\n# Setting this here on purpose, after the above section\
    \ which explicitly checks\n# for and handles exit errors.\nset -e\n\necho -e \"\
    \\n\\e[1mInitializating the CA...\\e[0m\"\n\n# CA password\nCA_PASSWORD=$(head\
    \ /dev/urandom | tr -dc A-Za-z0-9 | head -c 32 ; echo '')\n# Provisioner password\n\
    CA_PROVISIONER_PASSWORD=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32 ;\
    \ echo '')\n\nTMP_CA_PASSWORD=$(mktemp /tmp/autocert.XXXXXX)\nTMP_CA_PROVISIONER_PASSWORD=$(mktemp\
    \ /tmp/autocert.XXXXXX)\n\necho $CA_PASSWORD > $TMP_CA_PASSWORD\necho $CA_PROVISIONER_PASSWORD\
    \ > $TMP_CA_PROVISIONER_PASSWORD\n\nstep ca init \\\n  --name \"Humility Local\
    \ CA\" \\\n  --dns \"step-ca.step-ca-system.svc.cluster.local,step-ca.step-ca-system,step-ca,127.0.0.1\"\
    \ \\\n  --address \":9000\" \\\n  --provisioner \"admin\" \\\n  --with-ca-url\
    \ \"https://step-ca.step-ca-system.svc.cluster.local\" \\\n  --password-file \"\
    $TMP_CA_PASSWORD\" \\\n  --provisioner-password-file \"$TMP_CA_PROVISIONER_PASSWORD\"\
    \ \n\nrm -f $TMP_CA_PASSWORD $TMP_CA_PROVISIONER_PASSWORD\n\nstep ca provisioner\
    \ add acme --type ACME --force --ca-config \"$(step path)/config/ca.json\"\n\n\
    \necho -e \"\\n\\e[1mCreating configmaps and secrets in step-ca-system namespace\
    \ ...\\e[0m\"\n\n# Replace secrets created on helm install\n# It allows to properly\
    \ remove them on helm delete\nkbreplace -n step-ca-system create configmap step-ca-config\
    \ --from-file $(step path)/config\nkbreplace -n step-ca-system create configmap\
    \ step-ca-certs --from-file $(step path)/certs\nkbreplace -n step-ca-system create\
    \ configmap step-ca-secrets --from-file $(step path)/secrets\n\nkbreplace -n step-ca-system\
    \ create secret generic step-ca-ca-password --from-literal \"password=${CA_PASSWORD}\"\
    \nkbreplace -n step-ca-system create secret generic step-ca-provisioner-password\
    \ --from-literal \"password=${CA_PROVISIONER_PASSWORD}\"\n\n# Label all configmaps\
    \ and secrets\nkubectl -n step-ca-system label configmap step-ca-config helm.sh/chart=step-certificates-1.30.1\
    \ app.kubernetes.io/name=step-certificates app.kubernetes.io/instance=step-ca\
    \ app.kubernetes.io/version=\"0.30.2\" app.kubernetes.io/managed-by=Helm\nkubectl\
    \ -n step-ca-system label configmap step-ca-certs helm.sh/chart=step-certificates-1.30.1\
    \ app.kubernetes.io/name=step-certificates app.kubernetes.io/instance=step-ca\
    \ app.kubernetes.io/version=\"0.30.2\" app.kubernetes.io/managed-by=Helm\nkubectl\
    \ -n step-ca-system label configmap step-ca-secrets helm.sh/chart=step-certificates-1.30.1\
    \ app.kubernetes.io/name=step-certificates app.kubernetes.io/instance=step-ca\
    \ app.kubernetes.io/version=\"0.30.2\" app.kubernetes.io/managed-by=Helm\nkubectl\
    \ -n step-ca-system label secret step-ca-ca-password helm.sh/chart=step-certificates-1.30.1\
    \ app.kubernetes.io/name=step-certificates app.kubernetes.io/instance=step-ca\
    \ app.kubernetes.io/version=\"0.30.2\" app.kubernetes.io/managed-by=Helm\nkubectl\
    \ -n step-ca-system label secret step-ca-provisioner-password helm.sh/chart=step-certificates-1.30.1\
    \ app.kubernetes.io/name=step-certificates app.kubernetes.io/instance=step-ca\
    \ app.kubernetes.io/version=\"0.30.2\" app.kubernetes.io/managed-by=Helm\n\n#\
    \ Patch webhook if autocert is enabled\n\necho -e \"\\n\\e[1mStep Certificates\
    \ installed!\\e[0m\"\necho\necho \"CA URL: https://step-ca.step-ca-system.svc.cluster.local\"\
    \necho \"CA Fingerprint: $(step certificate fingerprint $(step path)/certs/root_ca.crt)\"\
    \necho"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: step-ca-config
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: step-ca-config
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
subjects:
- kind: ServiceAccount
  name: step-ca-config
  namespace: step-ca-system
roleRef:
  kind: Role
  name: step-ca-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: 9000
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: step-ca
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: step-certificates
      app.kubernetes.io/instance: step-ca
  serviceName: step-ca
  template:
    metadata:
      labels:
        app.kubernetes.io/name: step-certificates
        app.kubernetes.io/instance: step-ca
    spec:
      serviceAccountName: step-ca
      initContainers:
      - name: step-certificates-init
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - '20'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: step-certificates
        image: cr.smallstep.com/smallstep/step-ca:0.30.2
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/step-ca
        args:
        - --password-file
        - /home/step/secrets/passwords/password
        - /home/step/config/ca.json
        workingDir: /home/step
        env:
        - name: NAMESPACE
          value: step-ca-system
        ports:
        - name: https
          containerPort: 9000
          protocol: TCP
        livenessProbe:
          initialDelaySeconds: 5
          httpGet:
            path: /health
            port: 9000
            scheme: HTTPS
        readinessProbe:
          initialDelaySeconds: 5
          httpGet:
            path: /health
            port: 9000
            scheme: HTTPS
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: certs
          mountPath: /home/step/certs
          readOnly: true
        - name: config
          mountPath: /home/step/config
          readOnly: true
        - name: secrets
          mountPath: /home/step/secrets
          readOnly: true
        - name: ca-password
          mountPath: /home/step/secrets/passwords
          readOnly: true
        - name: database
          mountPath: /home/step/db
          readOnly: false
      volumes:
      - name: certs
        configMap:
          name: step-ca-certs
      - name: config
        configMap:
          name: step-ca-config
      - name: secrets
        configMap:
          name: step-ca-secrets
      - name: ca-password
        secret:
          secretName: step-ca-ca-password
  volumeClaimTemplates:
  - metadata:
      name: database
      labels:
        app.kubernetes.io/name: step-certificates
        app.kubernetes.io/instance: step-ca
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: local-path
---
apiVersion: batch/v1
kind: Job
metadata:
  name: step-ca
  namespace: step-ca-system
  labels:
    app.kubernetes.io/name: step-certificates
    app.kubernetes.io/instance: step-ca
    app.kubernetes.io/version: 0.30.2
spec:
  template:
    metadata:
      name: step-ca
      labels:
        app.kubernetes.io/name: step-certificates
        app.kubernetes.io/instance: step-ca
    spec:
      serviceAccountName: step-ca-config
      restartPolicy: Never
      volumes:
      - name: bootstrap
        configMap:
          name: step-ca-bootstrap
      containers:
      - name: config
        image: cr.smallstep.com/smallstep/step-ca-bootstrap:0.30.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /home/step/bootstrap/bootstrap.sh
        volumeMounts:
        - name: bootstrap
          mountPath: /home/step/bootstrap
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
