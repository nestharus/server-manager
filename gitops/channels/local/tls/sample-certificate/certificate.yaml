apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: humility-local-sample
  namespace: cert-manager-test
spec:
  secretName: humility-local-sample-tls
  duration: 24h
  renewBefore: 8h
  subject:
    organizations:
      - Humility
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - minio.minio-system.humility.local
  issuerRef:
    group: certmanager.step.sm
    kind: StepClusterIssuer
    name: humility-local-step-ca
