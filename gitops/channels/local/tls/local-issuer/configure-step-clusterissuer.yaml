apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-step-clusterissuer
  namespace: step-issuer-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-step-ca-bootstrap
  namespace: step-ca-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-step-clusterissuer-read-step-ca
  namespace: step-ca-system
subjects:
  - kind: ServiceAccount
    name: configure-step-clusterissuer
    namespace: step-issuer-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-step-ca-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: configure-step-clusterissuer
rules:
  - apiGroups: ["certmanager.step.sm"]
    resources: ["stepclusterissuers"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: configure-step-clusterissuer
subjects:
  - kind: ServiceAccount
    name: configure-step-clusterissuer
    namespace: step-issuer-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: configure-step-clusterissuer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-step-clusterissuer
  namespace: step-issuer-system
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configure-step-clusterissuer
        app.kubernetes.io/component: tls-bootstrap
    spec:
      serviceAccountName: configure-step-clusterissuer
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.34.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
            - |
              for _ in $(seq 1 120); do
                if kubectl -n step-ca-system get configmap step-ca-certs >/dev/null 2>&1 \
                  && kubectl -n step-ca-system get configmap step-ca-config >/dev/null 2>&1; then
                  break
                fi
                sleep 3
              done

              ca_bundle="$(kubectl -n step-ca-system get configmap step-ca-certs -o jsonpath='{.data.root_ca\.crt}' | base64 | tr -d '\n')"
              kid="$(kubectl -n step-ca-system get configmap step-ca-config -o jsonpath='{.data.ca\.json}' | tr -d '\n' | sed 's/.*"kid"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')"
              test -n "$ca_bundle"
              test -n "$kid"

              cat <<EOF | kubectl apply -f -
              apiVersion: certmanager.step.sm/v1beta1
              kind: StepClusterIssuer
              metadata:
                name: humility-local-step-ca
              spec:
                url: https://step-ca.step-ca-system.svc.cluster.local
                caBundle: ${ca_bundle}
                provisioner:
                  name: admin
                  kid: ${kid}
                  passwordRef:
                    name: step-ca-provisioner-password
                    namespace: step-ca-system
                    key: password
              EOF
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
