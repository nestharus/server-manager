apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkite-agent
  namespace: buildkite-agent
  labels:
    app.kubernetes.io/name: buildkite-agent
    platform.humility.gg/init: "109"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkite-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-agent
        platform.humility.gg/init: "109"
    spec:
      serviceAccountName: buildkite-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: buildkite/agent:3.104.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - >-
              if [ -z "${BUILDKITE_AGENT_TOKEN:-}" ]; then
                echo "Buildkite token unavailable; local-only mode active";
                sleep infinity;
              fi;
              exec buildkite-agent start
              --name "humility-local-${HOSTNAME}"
              --tags "queue=${BUILDKITE_AGENT_QUEUE},channel=local"
          env:
            - name: BUILDKITE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buildkite-agent-token
                  key: BUILDKITE_AGENT_TOKEN
                  optional: true
            - name: BUILDKITE_AGENT_QUEUE
              value: cicd-local
            - name: BUILDKITE_NO_PLUGINS
              value: "true"
            - name: BUILDKITE_AGENT_NO_COLOR
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
