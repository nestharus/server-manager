apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: buildkite-agent-token
  namespace: buildkite-agent
  labels:
    app.kubernetes.io/name: buildkite-agent
    platform.humility.gg/init: "109"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-cicd
        envSlug: local
        secretsPath: /buildkite/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: buildkite-agent-token
    secretNamespace: buildkite-agent
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: true
