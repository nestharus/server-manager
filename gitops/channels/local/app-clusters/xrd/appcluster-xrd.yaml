apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xappclusters.platform.humility.gg
spec:
  group: platform.humility.gg
  names:
    kind: XAppCluster
    plural: xappclusters
  claimNames:
    kind: AppCluster
    plural: appclusters
  defaultCompositionRef:
    name: appcluster-k3d-local
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - channel
                    - target
                    - k3sVersion
                  properties:
                    channel:
                      type: string
                      pattern: "^[a-z0-9][a-z0-9-]*$"
                    target:
                      type: string
                      enum:
                        - k3d-local
                        - vultr-vms
                    k3sVersion:
                      type: string
                      pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$"
                    local:
                      type: object
                      properties:
                        clusterName:
                          type: string
                          pattern: "^[a-z0-9][a-z0-9-]*$"
                        servers:
                          type: integer
                          minimum: 1
                        agents:
                          type: integer
                          minimum: 0
                    vultr:
                      type: object
                      properties:
                        region:
                          type: string
                          pattern: "^[a-z]{3}$"
                        serverPlan:
                          type: string
                          minLength: 1
                        sshKeyIds:
                          type: array
                          items:
                            type: string
                        allowedSshCidrs:
                          type: array
                          items:
                            type: string
            status:
              type: object
              properties:
                clusterName:
                  type: string
                endpoint:
                  type: string
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.parameters.target
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
