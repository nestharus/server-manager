apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: humility-local-app-cluster-claims
  namespace: flux-system
spec:
  dependsOn:
    - name: humility-local-app-cluster-api
    - name: humility-local-app-cluster-provider-configs
  interval: 1m
  retryInterval: 15s
  path: ./gitops/channels/local/app-clusters/claims
  prune: true
  wait: true
  timeout: 10m
  force: true
  sourceRef:
    kind: GitRepository
    name: humility-local
