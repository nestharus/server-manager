apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability-system
  labels:
    app.kubernetes.io/name: prometheus
    platform.humility.gg/init: "117"
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        channel: local
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.observability-system.svc.cluster.local:9093
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
            labels:
              platform_component: prometheus
              tenant: platform
      - job_name: platform-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: (flux-system|crossplane-system|cert-manager|infisical-system|minio-system|cnpg-system|kong-system|server-manager|buildkite-agent|observability-system)
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: (metrics|http-metrics|cmetrics)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_platform_humility_gg_tenant]
            target_label: tenant
          - source_labels: [__meta_kubernetes_pod_label_platform_humility_gg_channel]
            target_label: channel
      - job_name: server-manager-api
        metrics_path: /api/v1/metrics
        static_configs:
          - targets:
              - server-manager-api.server-manager.svc.cluster.local:8000
            labels:
              platform_component: api
              tenant: platform
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector.observability-system.svc.cluster.local:8888
            labels:
              platform_component: otel-collector
              tenant: platform
