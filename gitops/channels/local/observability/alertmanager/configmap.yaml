apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: observability-system
  labels:
    app.kubernetes.io/name: alertmanager
    platform.humility.gg/init: "117"
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: local-observability-log
      group_by: ["alertname", "channel", "tenant"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: local-observability-log
