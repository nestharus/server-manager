apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability-system
  labels:
    app.kubernetes.io/name: otel-collector
    platform.humility.gg/init: "117"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
