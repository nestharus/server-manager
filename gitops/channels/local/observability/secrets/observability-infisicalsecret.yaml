apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: observability-runtime
  namespace: observability-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      # Matches the Phase 5 Infisical operator pattern: one auth secret in
      # infisical-system with cluster-wide operator access for local manifests.
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-storage
        envSlug: local
        secretsPath: /object-storage/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: loki-object-storage
    secretNamespace: observability-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: true
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-admin
  namespace: observability-system
  labels:
    app.kubernetes.io/name: grafana
    platform.humility.gg/init: "117"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      # Matches the Phase 5 Infisical operator pattern: one auth secret in
      # infisical-system with cluster-wide operator access for local manifests.
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-observability
        envSlug: local
        secretsPath: /observability/local/grafana
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: grafana-admin
    secretNamespace: observability-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: true
