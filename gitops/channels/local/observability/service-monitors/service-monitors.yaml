apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flux
  namespace: observability-system
  labels:
    app.kubernetes.io/name: flux
    platform.humility.gg/init: "117"
spec:
  namespaceSelector:
    matchNames: ["flux-system"]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: ["source-controller", "kustomize-controller", "notification-controller"]
  endpoints:
    - port: http-prom
      interval: 30s
---
