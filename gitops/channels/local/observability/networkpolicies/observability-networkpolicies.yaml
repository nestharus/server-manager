apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny
  namespace: observability-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-ingress
  namespace: observability-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kong-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-egress
  namespace: observability-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crossplane-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infisical-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kong-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: server-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sample-app-db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: buildkite-agent
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-scrape
  namespace: flux-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-reachability
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector:
    matchLabels:
      app: crossplane
      release: crossplane
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crossplane-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.1.0/32
        - ipBlock:
            cidr: 172.28.0.3/32
        - ipBlock:
            cidr: 172.28.0.4/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-reachability
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: observability
    platform.humility.gg/init: "117"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/name: webhook
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability-system
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.1.1/32
        - ipBlock:
            cidr: 10.42.1.0/32
        - ipBlock:
            cidr: 172.28.0.3/32
        - ipBlock:
            cidr: 172.28.0.4/32
---
