apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-manager-web-ingress
  namespace: web
  labels:
    app.kubernetes.io/name: server-manager-web
    platform.humility.gg/init: "118"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server-manager-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium-proxy
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: server-manager
          podSelector:
            matchLabels:
              app.kubernetes.io/name: server-manager-api
      ports:
        - protocol: TCP
          port: 8000
