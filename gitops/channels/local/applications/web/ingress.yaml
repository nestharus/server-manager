apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-manager-web
  namespace: web
  labels:
    app.kubernetes.io/name: server-manager-web
    platform.humility.gg/init: "118"
  annotations:
    cert-manager.io/issuer: humility-local-step-ca
    cert-manager.io/issuer-kind: StepClusterIssuer
    cert-manager.io/issuer-group: certmanager.step.sm
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - web.local.humility.local
      secretName: server-manager-web-local-ingress-tls
  rules:
    - host: web.local.humility.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server-manager-web
                port:
                  number: 8080
