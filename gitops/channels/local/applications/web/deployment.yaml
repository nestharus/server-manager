apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-manager-web
  namespace: web
  labels:
    app.kubernetes.io/name: server-manager-web
    platform.humility.gg/init: "118"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server-manager-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-manager-web
        platform.humility.gg/channel: local
        platform.humility.gg/tenant: platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: k3d-humility-local:5000/local/server-manager-web:init-118-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
