apiVersion: batch/v1
kind: Job
metadata:
  name: server-manager-alembic-migrate-__ALEMBIC_HASH__
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager-api
    app.kubernetes.io/component: alembic-migrate
    platform.humility.gg/init: "113"
    platform.humility.gg/content-hash: "__ALEMBIC_HASH__"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-manager-api
        app.kubernetes.io/component: alembic-migrate
        platform.humility.gg/init: "113"
        platform.humility.gg/content-hash: "__ALEMBIC_HASH__"
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: k3d-humility-local:5000/local/server-manager-api:init-113-local
          imagePullPolicy: Always
          workingDir: /app
          command:
            - alembic
            - -c
            - /app/alembic.ini
            - upgrade
            - heads
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-postgres-url
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
