apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: server-manager-object-storage
  namespace: minio-system
  labels:
    app.kubernetes.io/name: server-manager
    app.kubernetes.io/component: object-storage-bootstrap
    platform.humility.gg/init: "113"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-storage
        envSlug: local
        secretsPath: /object-storage/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: server-manager-object-storage
    secretNamespace: minio-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        S3_ACCESS_KEY_ID: "{{ .MINIO_ROOT_USER.Value }}"
        S3_SECRET_ACCESS_KEY: "{{ .MINIO_ROOT_PASSWORD.Value }}"
