apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: server-manager-e2e-fixtures
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager
    platform.humility.gg/init: "128"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: server-manager
        envSlug: local
        secretsPath: /runtime/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: server-manager-e2e-fixtures
    secretNamespace: server-manager
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        applicant-receipt-signing-key: "{{ .APPLICANT_RECEIPT_SIGNING_KEY.Value }}"
        applicant-discord-user-id: "123456789012345678"
        applications-review-channel-id: "222222222222222222"
        application-managers-role-id: "333333333333333333"
        primary-guild-channel-url: "https://discord.com/channels/111111111111111111/222222222222222222"
