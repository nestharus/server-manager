apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-manager-api
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager-api
    platform.humility.gg/init: "113"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server-manager-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-manager-api
        platform.humility.gg/init: "113"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: k3d-humility-local:5000/local/server-manager-api:init-113-local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-postgres-url
                  key: url
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-postgres-url
                  key: url
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: SUPABASE_SERVICE_KEY
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: DISCORD_GUILD_ID
            - name: APPLICANT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: APPLICANT_OIDC_CLIENT_ID
            - name: APPLICANT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: APPLICANT_OIDC_CLIENT_SECRET
            - name: AUTHENTIK_AUTHORIZE_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: AUTHENTIK_AUTHORIZE_URL
            - name: AUTHENTIK_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: AUTHENTIK_TOKEN_URL
            - name: AUTHENTIK_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: AUTHENTIK_JWKS_URL
            - name: AUTHENTIK_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: AUTHENTIK_ISSUER_URL
            - name: APPLICANT_DISCORD_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: APPLICANT_DISCORD_REDIRECT_URI
            - name: APPLICANT_RECEIPT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: APPLICANT_RECEIPT_SIGNING_KEY
            - name: APPLICANT_RECEIPT_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: server-manager-runtime
                  key: APPLICANT_RECEIPT_TTL_SECONDS
            - name: S3_ENDPOINT
              value: http://minio.minio-system.svc.cluster.local:9000
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: server-manager
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: server-manager-object-storage
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: server-manager-object-storage
                  key: S3_SECRET_ACCESS_KEY
            - name: CEDAR_AUTHORIZATION_URL
              value: http://opal-client.auth-system.svc.cluster.local:8180
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
