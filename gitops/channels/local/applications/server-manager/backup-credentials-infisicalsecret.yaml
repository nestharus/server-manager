apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: server-manager-backup-object-storage
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager-postgres
    platform.humility.gg/init: "113"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-storage
        envSlug: local
        secretsPath: /object-storage/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: server-manager-backup-object-storage
    secretNamespace: server-manager
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        MINIO_ROOT_USER: "{{ .MINIO_ROOT_USER.Value }}"
        MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD.Value }}"

