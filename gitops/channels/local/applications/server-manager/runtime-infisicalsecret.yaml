apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: server-manager-runtime
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager
    platform.humility.gg/init: "113"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: server-manager
        envSlug: local
        secretsPath: /runtime/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: server-manager-runtime
    secretNamespace: server-manager
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN.Value }}"
        DISCORD_GUILD_ID: "{{ .DISCORD_GUILD_ID.Value }}"
        SUPABASE_SERVICE_KEY: "{{ .SUPABASE_SERVICE_KEY.Value }}"
        APPLICANT_OIDC_CLIENT_ID: "{{ .APPLICANT_OIDC_CLIENT_ID.Value }}"
        APPLICANT_OIDC_CLIENT_SECRET: "{{ .APPLICANT_OIDC_CLIENT_SECRET.Value }}"
        AUTHENTIK_AUTHORIZE_URL: "{{ .AUTHENTIK_AUTHORIZE_URL.Value }}"
        AUTHENTIK_TOKEN_URL: "{{ .AUTHENTIK_TOKEN_URL.Value }}"
        AUTHENTIK_JWKS_URL: "{{ .AUTHENTIK_JWKS_URL.Value }}"
        AUTHENTIK_ISSUER_URL: "{{ .AUTHENTIK_ISSUER_URL.Value }}"
        APPLICANT_DISCORD_REDIRECT_URI: "{{ .APPLICANT_DISCORD_REDIRECT_URI.Value }}"
        APPLICANT_RECEIPT_SIGNING_KEY: "{{ .APPLICANT_RECEIPT_SIGNING_KEY.Value }}"
        APPLICANT_RECEIPT_TTL_SECONDS: "{{ .APPLICANT_RECEIPT_TTL_SECONDS.Value }}"
