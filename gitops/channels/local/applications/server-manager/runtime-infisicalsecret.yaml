apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: server-manager-runtime
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager
    platform.humility.gg/init: "113"
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: server-manager
        envSlug: local
        secretsPath: /runtime/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: server-manager-runtime
    secretNamespace: server-manager
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        DISCORD_BOT_TOKEN: "{{ .DISCORD_BOT_TOKEN.Value }}"
        DISCORD_GUILD_ID: "{{ .DISCORD_GUILD_ID.Value }}"
        SUPABASE_SERVICE_KEY: "{{ .SUPABASE_SERVICE_KEY.Value }}"

