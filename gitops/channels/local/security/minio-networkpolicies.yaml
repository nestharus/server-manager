apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-s3-ingress
  namespace: minio-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: object-storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: object-storage-bootstrap
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sample-app-db
          podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: Exists
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-bootstrap-egress
  namespace: minio-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: object-storage-bootstrap
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/component: object-storage
      ports:
        - protocol: TCP
          port: 9000
