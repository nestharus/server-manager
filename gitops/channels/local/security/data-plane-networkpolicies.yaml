apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sample-postgres-from-atlas
  namespace: sample-app-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: sample-app-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atlas-operator
        - podSelector:
            matchLabels:
              cnpg.io/cluster: sample-app-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sample-postgres-egress
  namespace: sample-app-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: sample-app-postgres
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/component: object-storage
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
