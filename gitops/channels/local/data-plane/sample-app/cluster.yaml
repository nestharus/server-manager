apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sample-app-postgres
  namespace: sample-app-db
  labels:
    app.kubernetes.io/name: sample-app-postgres
    platform.humility.gg/init: "111"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: sample_app
      owner: sample_app
      secret:
        name: sample-app-postgres-app
  storage:
    size: 1Gi
  backup:
    retentionPolicy: "7d"
    # CNPG 1.29-compatible config only. INIT-112 must migrate this to the
    # Barman Cloud CNPG-I plugin before any CNPG 1.30 upgrade.
    barmanObjectStore:
      destinationPath: s3://humility-local-sample/cnpg/local/sample-app-postgres
      endpointURL: http://minio.minio-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-root
          key: MINIO_ROOT_USER
        secretAccessKey:
          name: minio-root
          key: MINIO_ROOT_PASSWORD
      wal:
        compression: gzip
