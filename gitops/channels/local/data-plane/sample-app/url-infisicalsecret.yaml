apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: sample-app-postgres-url
  namespace: sample-app-db
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-databases
        envSlug: local
        secretsPath: /postgres/local/sample-app
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: sample-app-postgres-url
    secretNamespace: sample-app-db
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        url: "{{ .url.Value }}"
