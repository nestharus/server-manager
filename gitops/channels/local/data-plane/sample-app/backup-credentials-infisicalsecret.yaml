apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: backup-object-storage
  namespace: sample-app-db
spec:
  hostAPI: http://infisical.infisical-system.svc.cluster.local:8080
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-operator-auth
        secretNamespace: infisical-system
      secretsScope:
        projectSlug: platform-storage
        envSlug: local
        secretsPath: /object-storage/local
        recursive: false
  syncConfig:
    resyncInterval: 60s
  managedSecretReference:
    secretName: backup-object-storage
    secretNamespace: sample-app-db
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        MINIO_ROOT_USER: "{{ .MINIO_ROOT_USER.Value }}"
        MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD.Value }}"
