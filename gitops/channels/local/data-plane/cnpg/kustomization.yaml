apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rendered/cnpg-1.29.0.yaml
patches:
  - target:
      kind: Namespace
      name: cnpg-system
    patch: |-
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: baseline
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1warn
        value: restricted
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1audit
        value: restricted
  - target:
      kind: MutatingWebhookConfiguration
      name: cnpg-mutating-webhook-configuration
    patch: |-
      - op: replace
        path: /webhooks/0/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/1/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/2/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/3/failurePolicy
        value: Ignore
  - target:
      kind: ValidatingWebhookConfiguration
      name: cnpg-validating-webhook-configuration
    patch: |-
      - op: replace
        path: /webhooks/0/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/1/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/2/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/3/failurePolicy
        value: Ignore
      - op: replace
        path: /webhooks/4/failurePolicy
        value: Ignore
