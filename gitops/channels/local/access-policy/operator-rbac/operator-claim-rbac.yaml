apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-operator-appcluster-claims
  namespace: platform-app-clusters
  labels:
    platform.humility.gg/init: "115"
rules:
  - apiGroups:
      - platform.humility.gg
    resources:
      - appclusters
      - appclusters/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-operator-appcluster-claims
  namespace: platform-app-clusters
  labels:
    platform.humility.gg/init: "115"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-operator-appcluster-claims
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: humility:platform-operators
