apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: public-intake-rate-limit
  namespace: server-manager
plugin: rate-limiting
config:
  minute: 5
  hour: 50
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server-manager-public-intake-api
  namespace: server-manager
  labels:
    app.kubernetes.io/name: server-manager-api
  annotations:
    konghq.com/plugins: public-intake-rate-limit
spec:
  ingressClassName: kong
  rules:
    - host: api.dev.humility.gg
      http:
        paths:
          - path: /api/v1/public/applications
            pathType: Prefix
            backend:
              service:
                name: server-manager-api
                port:
                  number: 8000
          - path: /api/v1/public/chapters
            pathType: Prefix
            backend:
              service:
                name: server-manager-api
                port:
                  number: 8000
