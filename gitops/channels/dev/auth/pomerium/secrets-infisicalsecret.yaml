apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pomerium-config
  namespace: auth-system
  labels:
    app.kubernetes.io/name: pomerium
spec:
  managedSecretReference:
    secretName: pomerium-config
    secretNamespace: auth-system
    secretType: Opaque
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        config.yaml: |
          authenticate_service_url: https://authenticate.dev.humility.gg
          idp_provider: oidc
          idp_provider_url: https://auth.dev.humility.gg/application/o/pomerium/
          routes:
            - from: https://web.dev.humility.gg
              path: /api/me
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /api/web/admin/
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /api/web/officer/
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              path: /applications/queue
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /applications/queue/
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /applications/
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /admin
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
            - from: https://web.dev.humility.gg
              prefix: /auth/discord/
              to: http://server-manager-api.server-manager.svc.cluster.local:8000
              preserve_host_header: true
              pass_identity_headers: false
              allow_public_unauthenticated_access: true
            - from: https://web.dev.humility.gg
              to: http://server-manager-web.web.svc.cluster.local:8080
              preserve_host_header: true
              allow_public_unauthenticated_access: true
            - from: https://protected-api.dev.humility.gg
              to: http://server-manager-api.server-manager.svc.cluster.local:8000
              preserve_host_header: true
              pass_identity_headers: true
              allow_any_authenticated_user: true
