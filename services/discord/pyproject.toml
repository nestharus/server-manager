[project]
name = "server-manager-discord"
version = "0.1.0"
description = "Discord gateway daemon for the Humility server manager."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3,<3",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "python-dotenv>=1.0.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
