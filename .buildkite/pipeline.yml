agents:
  queue: cicd-local

env:
  CHANNEL_ID: local
  IMAGE_APP: registry-smoke
  IMAGE_TAG: init-109-local
  IMAGE_CONTEXT: containers/samples/registry-smoke
  IMAGE_FILE: containers/samples/registry-smoke/Containerfile
  INIT113_IMAGE_TAG: init-113-local
  INIT118_IMAGE_TAG: init-118-local

steps:
  - key: init-109-smoke
    label: "INIT-109 smoke"
    command: "echo INIT-109 Buildkite local smoke"

  - key: unit-tests
    label: "Unit tests"
    command: "python -m pytest tests infra/tests"

  - key: api-tests
    label: "API tests"
    command: |
      command -v docker >/dev/null || (echo "BLOCKED: Docker required for testcontainers" && exit 2)
      docker info >/dev/null || (echo "BLOCKED: Docker required for testcontainers" && exit 2)
      cd services/api
      uv sync --dev
      uv run pytest -v tests/

  - key: discord-tests
    label: "Discord tests"
    command: |
      cd services/discord
      uv sync --dev
      uv run pytest -v tests/

  - key: web-tests
    label: "Web tests"
    command: |
      command -v npm >/dev/null || (echo "BLOCKED: web tests need INIT-118 recovery" && exit 2)
      cd services/web
      npm ci
      npm test

  - key: init-104-object-storage-static
    label: "INIT-104 object storage static validation"
    command: "infra/tests/validate_object_storage_local.sh --static-only"

  - key: init-111-data-plane-static
    label: "INIT-111 data plane static validation"
    command: "infra/tests/validate_data_plane_local.sh --static-only"

  - key: init-113-application-workloads-static
    label: "INIT-113 application workloads static validation"
    command: "infra/tests/validate_application_workloads_local.sh --static-only"

  - key: init-114-auth-stack-static
    label: "INIT-114 auth stack static validation"
    command: "infra/tests/validate_auth_stack_local.sh --static-only"

  - key: init-115-access-policy-static
    label: "INIT-115 access policy static validation"
    command: "infra/tests/validate_access_policy_local.sh --static-only"

  - key: init-116-tenant-isolation-static
    label: "INIT-116 tenant isolation static validation"
    command: "infra/tests/validate_tenant_isolation_local.sh --static-only"

  - key: init-117-observability-static
    label: "INIT-117 observability static validation"
    command: "infra/tests/validate_observability_local.sh --static-only"

  - key: init-118-web-ui-static
    label: "INIT-118 web UI static validation"
    command: "infra/tests/validate_web_ui_local.sh --static-only"

  - wait

  - key: registry-build-push
    label: "Build and push registry smoke image"
    command: >
      infra/scripts/build-channel-image.sh
      --channel "${CHANNEL_ID}"
      --app "${IMAGE_APP}"
      --tag "${IMAGE_TAG}"
      --context "${IMAGE_CONTEXT}"
      --file "${IMAGE_FILE}"

  - key: init-113-build-images
    label: "Build and push server-manager app images"
    command: >
      infra/scripts/build-server-manager-images.sh
      --channel "${CHANNEL_ID}"
      --tag "${INIT113_IMAGE_TAG}"

  - key: init-118-build-web
    label: "Build and push server-manager web image"
    command: >
      infra/scripts/build-channel-image.sh
      --channel "${CHANNEL_ID}"
      --app server-manager-web
      --tag "${INIT118_IMAGE_TAG}"
      --context .
      --file containers/server-manager/Containerfile.web
