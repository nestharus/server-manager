schema_version: 1
id: local
parent: null
exposure: dev
tenant: null
allow_ephemeral_children: true
enabled_platforms: [kubernetes]
cluster:
  distribution: k3s
  k3s_version: v1.32.13+k3s1
  target: k3d-local
  k3d:
    servers: 1
    agents: 1
    registry_name: humility-local
state:
  bucket: humility-tfstate
  key: channels/local/terraform.tfstate
  region: ewr
gitops:
  source_kind: git
  git_url: http://git-local.git-system.svc.cluster.local:8080/cgi-bin/git/humility-local.git
  git_ref: refs/heads/main
  path: ./gitops/channels/local
  kustomization_name: humility-local
  kustomization_namespace: flux-system
  sops_age_secret_name: sops-age
  decryption_secret_namespace: flux-system
  interval: 1m
  retry_interval: 1m
  prune: true
  wait: true
infisical:
  server_url: http://infisical.infisical-system.svc.cluster.local:8080
  project_id: platform-local
  environment: local
  secrets_path: /sample
  auth_method: universal-auth
  universal_auth_secret_name: infisical-operator-auth
  universal_auth_secret_namespace: infisical-system
  operator_namespace: infisical-system
  resync_interval: 60s
object_storage:
  provider: minio
  endpoint: http://minio.minio-system.svc.cluster.local:9000
  region: us-east-1
  bucket: humility-local-sample
  credentials_secret_name: minio-root
  credentials_secret_namespace: minio-system
  infisical_project: platform-storage
  infisical_path: /object-storage/local/
image_registry:
  provider: local-docker-registry
  registry_url: k3d-humility-local:5000
  push_url: localhost:5000
  pull_url: k3d-humility-local:5000
  repository_prefix: local
  credentials:
    required: false
  pull_through_cache:
    enabled: true
    implementation: distribution-proxy
    mirrors:
      - registry: docker.io
        cache_name: humility-local-cache-docker
        host_port: 5001
        remote_url: https://registry-1.docker.io
      - registry: quay.io
        cache_name: humility-local-cache-quay
        host_port: 5002
        remote_url: https://quay.io
      - registry: ghcr.io
        cache_name: humility-local-cache-ghcr
        host_port: 5003
        remote_url: https://ghcr.io
  sample:
    app: registry-smoke
    tag: init-108
    namespace: registry-smoke
cicd:
  provider: buildkite
  agent_namespace: buildkite-agent
  agent_image: buildkite/agent:3.104.0
  agent_queue: cicd-local
  agent_token_secret_name: buildkite-agent-token
  agent_token_secret_key: BUILDKITE_AGENT_TOKEN
  infisical_project: platform-cicd
  infisical_environment: local
  infisical_path: /buildkite/local
  local_pipeline_file: .buildkite/pipeline.yml
  local_mode: emulated
ingress:
  provider: kong
  gateway_namespace: kong-system
  chart_name: kong/kong
  chart_version: 3.2.0
  gateway_image: kong:3.9
  controller_image: kong/kubernetes-ingress-controller:3.5
  ingress_class_name: kong
  gateway_deployment_name: kong-kong
  proxy_service_name: kong-kong-proxy
  proxy_service_type: ClusterIP
  local_dns_namespace: local
  local_domain: humility.local
  remote_domain: humility.gg
  local_cluster_issuer_name: humility-local-step-ca
  remote_cluster_issuer_name: letsencrypt-staging
  default_service:
    name: minio
    namespace: minio-system
    service_port: 9000
    local_host: minio.local.humility.local
    remote_host: minio.local.humility.gg
    tls_secret_name: minio-local-ingress-tls
    proof_path: /minio/health/ready
auth_stack:
  namespace: auth-system
  authentik:
    chart_name: authentik/authentik
    chart_version: 2026.2.2
    image: ghcr.io/goauthentik/server:2026.2.2
    host: auth.local.humility.local
    database_cluster_name: authentik-postgres
    database_name: authentik
    database_owner: authentik
    infisical_project: platform-auth
    infisical_environment: local
    infisical_path: /auth/local/authentik
  pomerium:
    # INIT-114 intentionally uses Helm-rendered raw manifests for this local
    # slice. INIT-115 owns remote-channel Pomerium deployment strategy review.
    chart_name: pomerium/pomerium
    chart_version: 34.0.1
    image: pomerium/pomerium:v0.22.1
    authenticate_host: authenticate.local.humility.local
    proxy_host: protected-api.local.humility.local
    infisical_project: platform-auth
    infisical_environment: local
    infisical_path: /auth/local/pomerium
  opal_cedar:
    chart_name: permitio/opal
    chart_version: 0.0.29
    server_image: docker.io/permitio/opal-server:0.7.12
    client_image: docker.io/permitio/opal-client-cedar:0.7.12
    proof_path: /v1/is_authorized
  protected_api:
    host: protected-api.local.humility.local
    backend_service: server-manager-api
    backend_namespace: server-manager
    backend_port: 8000
    proof_path: /api/v1/protected/authz-proof
access_policy:
  policy_repo_path: policy/cedar/channels/local
  bundle_config_map_name: cedar-access-policy-bundle
  bootstrap_job_name: cedar-access-policy-bootstrap
  policy_review:
    required_checks:
      - cedar bundle renders from channel/service paths
      - service identity claims map to Cedar Service principals
      - break-glass dry-run completes before runtime recovery
  services:
    server_manager_api:
      service_name: server-manager-api
      bundle_path: policy/cedar/channels/local/services/server-manager-api
      sample_user: sample@local.humility.local
      sample_service_principal: Service::"buildkite-agent.local"
  service_identity:
    issuer: https://auth.local.humility.local/application/o/humility-service-identities/
    audience: server-manager-api
    claim_namespace: humility.gg/service
    identities:
      buildkite_agent:
        subject: system:serviceaccount:buildkite-agent:buildkite-agent
        cedar_principal: Service::"buildkite-agent.local"
        allowed_actions:
          - Action::"api:ci:deploy"
      crossplane_provider:
        subject: system:serviceaccount:crossplane-system:provider-kubernetes
        cedar_principal: Service::"crossplane-provider.local"
        allowed_actions:
          - Action::"cluster:claim:reconcile"
  credential_rotation:
    cadence_days:
      infisical_universal_auth_tokens: 30
      sops_age_key: 180
      sops_recipients: 180
    infisical_paths:
      - /auth/local/authentik
      - /auth/local/pomerium
      - /buildkite/local
      - /object-storage/local
      - /postgres/local/server-manager
    script: infra/scripts/rotate-platform-credentials.sh
  break_glass:
    script: infra/scripts/break-glass-sops-recovery.sh
    sentinel_path: gitops/bootstrap/sops-sentinel.enc.yaml
    flux_kustomization: humility-local
    flux_namespace: flux-system
  object_storage_policy:
    versioning: enabled
    encryption: sse-s3
    lifecycle_days: 30
    script: infra/scripts/apply-object-storage-policies.sh
  operator_rbac:
    crossplane_admin_binding_removed: true
    operator_group: humility:platform-operators
    claim_namespace: platform-app-clusters
data_plane:
  provider: cloudnative-pg
  cnpg:
    operator_namespace: cnpg-system
    operator_version: 1.29.0
    operator_manifest: gitops/channels/local/data-plane/cnpg/rendered/cnpg-1.29.0.yaml
    postgres_image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  atlas:
    operator_namespace: atlas-operator
    chart_name: oci://ghcr.io/ariga/charts/atlas-operator
    chart_version: 0.7.28
    operator_image: arigaio/atlas-operator:0.7.28
    rendered_manifest: gitops/channels/local/data-plane/atlas/rendered/atlas-operator-0.7.28.yaml
  sample:
    namespace: sample-app-db
    cluster_name: sample-app-postgres
    instances: 1
    database: sample_app
    owner: sample_app
    service_name: sample-app-postgres-rw
    storage_size: 1Gi
  credentials:
    infisical_project: platform-databases
    infisical_environment: local
    infisical_path: /postgres/local/sample-app
    app_secret_name: sample-app-postgres-app
    url_secret_name: sample-app-postgres-url
  migrations:
    atlas_migration_name: sample-app
    config_map_name: sample-app-atlas-migrations
    repo_dir: database/migrations/sample-app
    revisions_schema: atlas_schema_revisions
    verify_table: sample_app.widgets
backup:
  provider: minio
  endpoint: http://minio.minio-system.svc.cluster.local:9000
  bucket: humility-local-backups
  region: us-east-1
  destination_path: s3://humility-local-backups/cnpg/local/sample-app-postgres
  retention_policy: 7d
  schedule: "0 0 0 * * *"
  credentials_secret_name: backup-object-storage
  credentials_secret_namespace: sample-app-db
  infisical_project: platform-storage
  infisical_environment: local
  infisical_path: /object-storage/local/
tls:
  provider: step-ca
  local_cluster_issuer_name: humility-local-step-ca
  step_ca_namespace: step-ca-system
  step_ca_service_name: step-ca
  step_issuer_namespace: step-issuer-system
  sample_certificate_namespace: cert-manager-test
  sample_certificate_name: humility-local-sample
  local_domain: humility.local
dns:
  provider: coredns
  local_domain: humility.local
  cluster_domain: cluster.local
  coredns_configmap_namespace: kube-system
  coredns_configmap_name: coredns
  sample_lookup_name: minio.minio-system.humility.local
app_cluster:
  provider: crossplane
  claim_namespace: platform-app-clusters
  sample_claim_name: local-sample
  crossplane_namespace: crossplane-system
  provider_kubernetes_package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.18.0
  provider_vultr_package: xpkg.upbound.io/crossplane-contrib/provider-vultr:v0.2.0
  local:
    target: k3d-local
    cluster_name: humility-local-app
    servers: 1
    agents: 0
    docker_socket_hostpath: /var/run/docker.sock
  vultr:
    credentials_secret_name: vultr-creds
    credentials_secret_namespace: crossplane-system
    credentials_secret_key: credentials
    infisical_project: platform-vultr
    infisical_path: /api
security:
  pod_security:
    system_enforce: baseline
    app_enforce: restricted
    system_namespaces:
      - cert-manager
      - crossplane-system
      - flux-system
      - git-system
      - cnpg-system
      - kong-system
      - step-ca-system
      - step-issuer-system
    restricted_namespaces:
      - cert-manager-test
      - humility-gitops-sentinel
      - buildkite-agent
      - infisical-sample
      - infisical-system
      - local
      - minio-system
      - platform-app-clusters
      - atlas-operator
      - sample-app-db
    local_privileged_namespaces:
      - app-cluster-system
  network_policy:
    default_deny_namespaces:
      - cert-manager-test
      - humility-gitops-sentinel
      - buildkite-agent
      - infisical-sample
      - infisical-system
      - local
      - minio-system
      - platform-app-clusters
      - sample-app-db
