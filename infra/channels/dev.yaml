schema_version: 1
id: dev
parent: null
exposure: dev
tenant: null
allow_ephemeral_children: true
enabled_platforms: [kubernetes]
cluster:
  distribution: k3s
  k3s_version: v1.32.13+k3s1
  target: vultr-vms
  vultr_vms:
    region: ewr
    allowed_ssh_cidrs: []
    remote_kubeconfig_path: /root/humility-k3s.yaml
    firewall_name: null
    ssh_key_ids: []
    servers:
      count: 1
      plan: vc2-2c-4gb
    agents:
      count: 0
      plan: vc2-2c-4gb
state:
  bucket: humility-tfstate
  key: channels/dev/terraform.tfstate
  region: ewr
object_storage:
  provider: vultr-object-storage
  endpoint: https://ewr1.vultrobjects.com
  region: ewr
  bucket: humility-dev-sample
  credentials_secret_name: vultr-object-storage
  credentials_secret_namespace: app-runtime
  infisical_project: platform-storage
  infisical_path: /object-storage/dev/
tls:
  provider: acme
  remote_cluster_issuer_name: letsencrypt-staging
  acme_server: https://acme-staging-v02.api.letsencrypt.org/directory
  acme_email: platform-admin@humility.example
  cloudflare_api_token_secret_name: cloudflare-api-token
  cloudflare_api_token_secret_namespace: external-dns-system
dns:
  provider: cloudflare
  domain: humility.example
  external_dns_owner_id: humility-dev
  cloudflare_api_token_secret_name: cloudflare-api-token
  cloudflare_api_token_secret_namespace: external-dns-system
  infisical_project: platform-dns
  infisical_path: /dns/dev/
# gitops is deliberately omitted for INIT-102; dev keeps the single-cluster remote posture until remote Flux wiring is scoped.
