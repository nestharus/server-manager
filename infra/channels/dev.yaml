schema_version: 1
id: dev
parent: null
exposure: dev
tenant: null
allow_ephemeral_children: true
enabled_platforms: [kubernetes]
cluster:
  distribution: k3s
  k3s_version: v1.32.13+k3s1
  target: vultr-vms
  vultr_vms:
    region: ewr
    allowed_ssh_cidrs: []
    remote_kubeconfig_path: /root/humility-k3s.yaml
    firewall_name: null
    ssh_key_ids: []
    servers:
      count: 1
      plan: vc2-2c-4gb
    agents:
      count: 0
      plan: vc2-2c-4gb
state:
  bucket: humility-tfstate
  key: channels/dev/terraform.tfstate
  region: ewr
object_storage:
  provider: vultr-object-storage
  endpoint: https://ewr1.vultrobjects.com
  region: ewr
  bucket: humility-dev-sample
  credentials_secret_name: vultr-object-storage
  credentials_secret_namespace: app-runtime
  infisical_project: platform-storage
  infisical_path: /object-storage/dev/
image_registry:
  provider: vultr-container-registry
  registry_url: ewr.vultrcr.com/humility
  push_url: ewr.vultrcr.com/humility
  pull_url: ewr.vultrcr.com/humility
  repository_prefix: dev
  credentials:
    required: true
    secret_name: vultr-cr-credentials
    secret_namespace: app-runtime
    dockerconfigjson_key: .dockerconfigjson
    infisical_project: platform-registry
    infisical_path: /registry/dev
  pull_through_cache:
    enabled: false
    implementation: none
    mirrors: []
  sample:
    app: registry-smoke
    tag: init-108
    namespace: registry-smoke
cicd:
  provider: buildkite
  agent_namespace: buildkite-agent
  agent_image: buildkite/agent:3.104.0
  agent_queue: cicd-dev
  agent_token_secret_name: buildkite-agent-token
  agent_token_secret_key: BUILDKITE_AGENT_TOKEN
  infisical_project: platform-cicd
  infisical_environment: dev
  infisical_path: /buildkite/dev
  local_pipeline_file: .buildkite/pipeline.yml
  local_mode: emulated
ingress:
  provider: kong
  gateway_namespace: kong-system
  chart_name: kong/kong
  chart_version: 3.2.0
  gateway_image: kong:3.9
  controller_image: kong/kubernetes-ingress-controller:3.5
  ingress_class_name: kong
  gateway_deployment_name: kong-kong
  proxy_service_name: kong-kong-proxy
  proxy_service_type: LoadBalancer
  local_dns_namespace: local
  local_domain: humility.local
  remote_domain: humility.gg
  local_cluster_issuer_name: humility-local-step-ca
  remote_cluster_issuer_name: letsencrypt-staging
  default_service:
    name: minio
    namespace: minio-system
    service_port: 9000
    local_host: minio.local.humility.local
    remote_host: minio.dev.humility.gg
    tls_secret_name: minio-dev-ingress-tls
    proof_path: /minio/health/ready
tls:
  provider: acme
  remote_cluster_issuer_name: letsencrypt-staging
  acme_server: https://acme-staging-v02.api.letsencrypt.org/directory
  acme_email: acme-bootstrap@humility.gg
  cloudflare_api_token_secret_name: cloudflare-api-token
  cloudflare_api_token_secret_namespace: external-dns-system
dns:
  provider: cloudflare
  domain: humility.example
  external_dns_owner_id: humility-dev
  cloudflare_api_token_secret_name: cloudflare-api-token
  cloudflare_api_token_secret_namespace: external-dns-system
  infisical_project: platform-dns
  infisical_path: /dns/dev/
app_cluster:
  provider: crossplane
  claim_namespace: platform-app-clusters
  sample_claim_name: dev-sample
  crossplane_namespace: crossplane-system
  provider_kubernetes_package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.18.0
  provider_vultr_package: xpkg.upbound.io/crossplane-contrib/provider-vultr:v0.2.0
  vultr:
    credentials_secret_name: vultr-creds
    credentials_secret_namespace: crossplane-system
    credentials_secret_key: credentials
    infisical_project: platform-vultr
    infisical_path: /api
    server_plan: vc2-2c-4gb
# gitops is deliberately omitted for INIT-102; dev keeps the single-cluster remote posture until remote Flux wiring is scoped.
