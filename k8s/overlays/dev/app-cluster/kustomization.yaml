apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dev-app-cluster-overlay
    literals:
      - gitops.foundation.layer=overlay
      - gitops.foundation.environment=dev
      - gitops.foundation.clusterRole=app-cluster
      - gitops.foundation.target=application-runtime
