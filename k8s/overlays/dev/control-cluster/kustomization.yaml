apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dev-control-cluster-overlay
    literals:
      - gitops.foundation.layer=overlay
      - gitops.foundation.environment=dev
      - gitops.foundation.clusterRole=control-cluster
      - gitops.foundation.target=platform-control-plane
