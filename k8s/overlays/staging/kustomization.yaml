apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/secrets
  - ../../base/monitoring
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
        namespace: monitoring
      spec:
        interval: 10m
        timeout: 5m
        values:
          prometheus:
            prometheusSpec:
              retention: 3d
              resources:
                requests:
                  cpu: 150m
                  memory: 256Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
          grafana:
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 100m
                memory: 192Mi
          alertmanager:
            alertmanagerSpec:
              retention: 48h
              resources:
                requests:
                  cpu: 15m
                  memory: 64Mi
                limits:
                  cpu: 50m
                  memory: 128Mi
          prometheusOperator:
            resources:
              requests:
                cpu: 25m
                memory: 96Mi
              limits:
                cpu: 100m
                memory: 192Mi
          kube-state-metrics:
            resources:
              requests:
                cpu: 25m
                memory: 48Mi
              limits:
                cpu: 75m
                memory: 96Mi
          prometheus-node-exporter:
            resources:
              requests:
                cpu: 15m
                memory: 24Mi
              limits:
                cpu: 50m
                memory: 48Mi
  - target:
      kind: HelmRelease
      name: sealed-secrets-controller
      namespace: sealed-secrets
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: sealed-secrets-controller
        namespace: sealed-secrets
      spec:
        interval: 10m
        timeout: 3m
        values:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
