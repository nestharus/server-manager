apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  url: https://github.com/nestharus/server-manager.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/base/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# This file is a bootstrap skeleton. Running `flux bootstrap` will overwrite
# it with values matching the target cluster and repository configuration.
