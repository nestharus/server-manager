apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets-controller
  namespace: sealed-secrets
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: sealed-secrets
      version: "~2.18"  # Current stable as of April 2026
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: sealed-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: sealed-secrets-controller
