# This SealedSecret must be created AFTER the sealed-secrets controller is running.
#
# Bootstrap sequence:
# 1. Deploy sealed-secrets controller (k8s/base/secrets/)
# 2. Fetch the controller's public key:
#      kubeseal --fetch-cert > sealed-secrets.crt
# 3. Create the plaintext Secret locally (do NOT commit it):
#      kubectl -n monitoring create secret generic grafana-admin-credentials \
#        --from-literal=admin-user=admin \
#        --from-literal=admin-password='CHANGE_ME' \
#        --dry-run=client -o yaml > /tmp/grafana-admin-secret.yaml
# 4. Seal it:
#      kubeseal --format yaml --cert sealed-secrets.crt \
#        < /tmp/grafana-admin-secret.yaml \
#        > k8s/base/monitoring/grafana-admin-secret.yaml
# 5. Commit the sealed manifest and let Flux reconcile it.
#
# Placeholder manifest: replace the encrypted values with real kubeseal output.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  encryptedData:
    admin-user: REPLACE_ME_WITH_SEALED_SECRET
    admin-password: REPLACE_ME_WITH_SEALED_SECRET
  template:
    metadata:
      name: grafana-admin-credentials
      namespace: monitoring
    type: Opaque
