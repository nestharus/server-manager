# Grafana Admin Credentials — Bootstrap Dependency
#
# This file intentionally contains no Kubernetes resource. Do NOT commit
# a plaintext Secret or fake placeholder values for Grafana credentials.
#
# The kube-prometheus-stack HelmRelease expects a Secret named
# `grafana-admin-credentials` in the `monitoring` namespace with keys:
#   - admin-user
#   - admin-password
#
# Bootstrap sequence after the sealed-secrets controller is running:
# 1. Fetch the controller certificate:
#      kubeseal --fetch-cert > sealed-secrets.crt
# 2. Create the plaintext Secret locally (do NOT commit it):
#      kubectl -n monitoring create secret generic grafana-admin-credentials \
#        --from-literal=admin-user=admin \
#        --from-literal=admin-password='CHANGE_ME' \
#        --dry-run=client -o yaml > /tmp/grafana-admin-secret.yaml
# 3. Seal it:
#      kubeseal --format yaml --cert sealed-secrets.crt \
#        < /tmp/grafana-admin-secret.yaml \
#        > k8s/base/monitoring/grafana-admin-secret.yaml
# 4. Commit the generated SealedSecret manifest in place of this file.
#
# Until the controller cert exists, this path remains documentation-only.
