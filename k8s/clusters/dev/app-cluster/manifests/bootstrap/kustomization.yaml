apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dev-app-cluster-bootstrap-slot
    literals:
      - gitops.foundation.slot=downstream-flux-bootstrap
      - gitops.foundation.owner=gitops-foundation
      - gitops.foundation.path=clusters/dev/app-cluster/manifests/bootstrap
      - gitops.foundation.clusterRootsRemainSelfManaged=true
