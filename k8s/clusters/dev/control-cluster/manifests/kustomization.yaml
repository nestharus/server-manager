apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../overlays/dev/control-cluster
  - claims
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dev-control-cluster-root-contract
    literals:
      - gitops.foundation.layer=cluster-root
      - gitops.foundation.scope=clusters/dev/control-cluster
      - gitops.foundation.desiredState=git
      - gitops.foundation.reconciler=flux
      - gitops.foundation.promotion=git-change-only
