apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: dev-control-cluster-root
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: ssh://git@example.com/humility/discord.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-control-cluster-root
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/clusters/dev/control-cluster/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: dev-control-cluster-root
  timeout: 5m0s
  wait: true
