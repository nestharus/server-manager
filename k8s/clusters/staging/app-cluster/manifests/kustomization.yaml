apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../overlays/staging/app-cluster
  - bootstrap
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: staging-app-cluster-root-contract
    literals:
      - gitops.foundation.layer=cluster-root
      - gitops.foundation.scope=clusters/staging/app-cluster
      - gitops.foundation.desiredState=git
      - gitops.foundation.reconciler=flux
      - gitops.foundation.promotion=git-change-only
